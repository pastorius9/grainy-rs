# Builds, tests and packages Grainy RS on GitHub-hosted runners: the Windows zip (windows-2022) and the macOS
# disk image (macos-15, Apple Silicon, universal binaries). A version tag or the designated release branch
# publishes both tested packages together.
name: Build

on:
  push:
    branches: [main, mac, release/v0.3.0]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  # Tests and smoke runs never use the network.
  GRAINY_OFFLINE: '1'

jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 240
    env:
      # The runner has no graphics card and its WARP software adapter loses the device in the GPU tests
      # (Windows Server 2022 only; WARP on Windows 11, Metal and hardware pass): skip them here, loudly.
      GRAINY_CI_NO_GPU: '1'
      GRAINY_JPEG_ASSEMBLER: nasm
    steps:
      - name: Check out without line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install NASM for the Windows x64 JPEG encoder
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # setup-nasm v1
        with:
          version: '2.16.01'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows

      - name: Version
        id: version
        shell: bash
        run: |
          version="$(python -c "import sys; sys.path.insert(0, 'tools/release'); import layout; print(layout.version())")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Grainy RS $version"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Build and package the Windows release
        run: python tools/release/make_release.py --dist dist

      - name: Import check (no Visual C++ runtime except vcomp140.dll)
        run: python tools/release/check_imports.py dist/GrainyRS-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Smoke run of the zip
        run: python tools/release/smoke.py dist/GrainyRS-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: GrainyRS-${{ steps.version.outputs.version }}-windows-x64.zip
          path: |
            dist/GrainyRS-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/GrainyRS-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Keep snapshot differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshot-differences
          path: crates/grainy-app/tests/snapshots/*.new.png
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos

      - name: Version
        id: version
        run: |
          version="$(python -c "import sys; sys.path.insert(0, 'tools/release'); import layout; print(layout.version())")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Grainy RS $version"

      - name: Format
        run: cargo fmt --check

      - name: Clippy (Apple Silicon)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (Apple Silicon)
        run: cargo test --workspace --all-features --no-fail-fast

      # The same certificate in every release keeps the folder and disk permissions macOS gave the app.
      # Without the secrets (a pull request from a fork, or none set) the app is signed ad hoc.
      - name: Signing identity (the same certificate for every release)
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ] && { [ -n "$PASSWORD" ] || [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v0.3.0 ]]; }; then
            echo "::error::The release signing certificate is missing."; exit 1
          fi
          if [ -z "$P12" ]; then echo "::notice::No signing certificate in the secrets: the app is signed ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/grainy-signing.keychain-db"; KEYPASS="$(openssl rand -hex 16)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/grainy.p12"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/grainy.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/grainy.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trusted for code signing on this runner only, so codesign accepts it.
          security find-certificate -c "Grainy Code Signing" -p "$KEYCHAIN" > "$RUNNER_TEMP/grainy.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/grainy.pem"
          security find-identity -p codesigning "$KEYCHAIN"
          echo "GRAINY_SIGN_IDENTITY=Grainy Code Signing" >> "$GITHUB_ENV"
          echo "GRAINY_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: App bundle, signing, smoke run and disk image
        run: python tools/release/make_macos.py --dist dist

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: GrainyRS-${{ steps.version.outputs.version }}-macos-universal.dmg
          path: |
            dist/GrainyRS-${{ steps.version.outputs.version }}-macos-universal.dmg
            dist/GrainyRS-${{ steps.version.outputs.version }}-macos-universal.dmg.sha256
          if-no-files-found: error

      - name: Keep snapshot differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-snapshot-differences
          path: crates/grainy-app/tests/snapshots/*.new.png
          if-no-files-found: ignore

  publish:
    if: >-
      github.repository == 'pastorius9/grainy-rs' && github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v0.3.0')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-grainy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: GrainyRS-${{ needs.windows.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Verify both packages and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/publish_release.py dist
