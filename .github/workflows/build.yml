# Builds and tests Grainy RS on GitHub-hosted runners (Windows x64, macOS Apple Silicon).
# First version: tests on both systems and release builds, to find what macOS needs.
name: Build

on:
  push:
    branches: [main, mac]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  # Tests and smoke runs never use the network.
  GRAINY_OFFLINE: '1'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Check out without line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Release build
        if: ${{ !cancelled() }}
        run: cargo build --release -p grainy-app -p grainy-cli

      - name: Keep snapshot differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshot-differences
          path: crates/grainy-app/tests/snapshots/*.new.png
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Tests (Apple Silicon)
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --no-fail-fast

      - name: Release build (Apple Silicon)
        if: ${{ !cancelled() }}
        run: cargo build --release --target aarch64-apple-darwin -p grainy-app -p grainy-cli

      - name: Release build (Intel)
        if: ${{ !cancelled() }}
        run: cargo build --release --target x86_64-apple-darwin -p grainy-app -p grainy-cli

      - name: Keep snapshot differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-snapshot-differences
          path: crates/grainy-app/tests/snapshots/*.new.png
          if-no-files-found: ignore
