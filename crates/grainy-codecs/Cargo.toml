[package]
name = "grainy-codecs"
description = "Oracle-compatible bitmap loading, metadata and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
grainy-core.workspace = true
grainy-color = { path = "../grainy-color" }
grainy-jpeg-sys = { path = "../grainy-jpeg-sys" }
ndarray.workspace = true
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
png = "=0.18.1"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw", "jpeg"] }
image-webp = "=0.2.4"
image = { version = "=0.25.10", default-features = false, features = ["bmp"] }
zune-core = "=0.5.3"
avif-serialize = "=0.8.9"
rav1e = { version = "=0.8.1", default-features = false, features = ["threading"] }
ravif = { version = "=0.13.0", default-features = false, features = ["threading"] }
zune-jpegxl = "=0.5.2"
jxl-oxide = { path = "vendor/jxl-oxide/crates/jxl-oxide" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
weezl = "=0.1.12"

[build-dependencies]
cc = "1"

[dev-dependencies]
grainy-testkit.workspace = true

[lints]
workspace = true
